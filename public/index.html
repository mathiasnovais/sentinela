@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap");
/* Tokens do design system Sentinela (gerado a partir de tokens.json) */
:root, [data-theme="dark"] {
  --bg-000: #020609;
  --bg-100: #050b12;
  --bg-200: #08121c;
  --bg-300: #0d1b28;
  --line: #12283a;
  --line-strong: #3d7d99;
  --ink: #e8f6ff;
  --ink-muted: #8fb0c6;
  --ink-subtle: #7c9db3;
  --accent: #00e5ff;
  --accent-soft: #062a3a;
  --on-accent: #021018;
  --focus: var(--accent);
  --ok: #39ff9e;
  --ok-soft: #053124;
  --warn: #ff7a00;
  --warn-soft: #3f1e05;
  --method-patch: #ffd23f;
  --method-patch-soft: #3a2f08;
  --error: #ff5c7a;
  --error-soft: #3a0f1c;
  --heat-0: rgba(0,229,255,0.06);
  --heat-1: #0b3d55;
  --heat-2: #0a6d8f;
  --heat-3: #00a9c9;
  --heat-4: #00e5ff;
  --map-land: #2fb6d9;
  --shadow-pop: 0 12px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,229,255,0.12);
  --shadow-active: 0 0 0 1px rgba(0,229,255,0.45), 0 0 18px rgba(0,229,255,0.25);
  --glow-accent: 0 0 12px rgba(0,229,255,0.55), 0 0 32px rgba(0,229,255,0.2);
  --glow-ok: 0 0 10px rgba(57,255,158,0.45);
  --glow-warn: 0 0 10px rgba(255,122,0,0.55);
  --glow-error: 0 0 10px rgba(255,92,122,0.5);
  --shadow-card: 0 0 0 1px rgba(0,229,255,0.06), 0 0 24px rgba(0,229,255,0.04);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 999px;
  --font-sans: "Geist", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
[data-theme="light"] {
  --bg-000: #e6edf2;
  --bg-100: #f4f8fb;
  --bg-200: #ffffff;
  --bg-300: #eaf1f6;
  --line: #dae4eb;
  --line-strong: #74899a;
  --ink: #0d1b26;
  --ink-muted: #4b6070;
  --ink-subtle: #5a6e7e;
  --accent: #0073a3;
  --accent-soft: #dff3fb;
  --on-accent: #ffffff;
  --focus: var(--accent);
  --ok: #0b7a4f;
  --ok-soft: #dcf5ea;
  --warn: #a84200;
  --warn-soft: #ffe8d6;
  --method-patch: #7a5a00;
  --method-patch-soft: #fff3c4;
  --error: #c42b3f;
  --error-soft: #fde4e7;
  --heat-0: #edf3f7;
  --heat-1: #c3e7f5;
  --heat-2: #80cbe8;
  --heat-3: #2b9fcb;
  --heat-4: #005f87;
  --map-land: #2b86ad;
  --shadow-pop: 0 12px 32px rgba(10,40,60,0.12);
  --shadow-active: 0 0 0 1px rgba(0,115,163,0.25), 0 6px 16px rgba(0,115,163,0.12);
  --glow-accent: 0 0 0 rgba(0,0,0,0);
  --glow-ok: 0 0 0 rgba(0,0,0,0);
  --glow-warn: 0 0 0 rgba(0,0,0,0);
  --glow-error: 0 0 0 rgba(0,0,0,0);
  --shadow-card: 0 0 0 rgba(0,0,0,0);
}



.st-icon { flex: none; display: block; }
.st-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.st-mono { font-family: var(--font-mono); font-size: 13px; line-height: 18px; }
.st-muted-sm { font-size: 11px; line-height: 16px; color: var(--ink-subtle); }

/* Button */
.st-btn { white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 500; border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.st-btn-md { height: 36px; padding: 0 var(--space-4); }
.st-btn-sm { height: 28px; padding: 0 var(--space-3); font-size: 13px; }
.st-btn-icon.st-btn-md { width: 36px; padding: 0; }
.st-btn-icon.st-btn-sm { width: 28px; padding: 0; }
.st-btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--glow-accent); }
.st-btn-primary:hover { filter: brightness(1.1); }
.st-btn-secondary { background: var(--bg-300); color: var(--ink); border-color: var(--line-strong); }
.st-btn-secondary:hover { background: var(--bg-200); }
.st-btn-ghost { background: transparent; color: var(--ink-muted); border-color: var(--line); }
.st-btn-ghost:hover { background: var(--bg-300); color: var(--ink); }
.st-btn:focus-visible, .st-nav:focus-visible, .st-select select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.st-btn:disabled { opacity: .45; cursor: not-allowed; }

/* Badge */
.st-badge { display: inline-flex; align-items: center; gap: var(--space-1); height: 22px; padding: 0 8px; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
.st-badge-dot { width: 6px; height: 6px; border-radius: var(--radius-full); background: currentColor; box-shadow: 0 0 6px currentColor; }
.st-badge-neutral { background: var(--bg-300); color: var(--ink-muted); }
.st-badge-accent { background: var(--accent-soft); color: var(--accent); }
.st-badge-ok { background: var(--ok-soft); color: var(--ok); }
.st-badge-warn { background: var(--warn-soft); color: var(--warn); }
.st-badge-error { background: var(--error-soft); color: var(--error); }

/* MethodTag */
.st-method { display: inline-flex; align-items: center; justify-content: center; min-width: 52px; height: 22px; padding: 0 6px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: .04em; background: var(--bg-300); color: var(--ink-muted); }
.st-method-get { background: var(--accent-soft); color: var(--accent); }
.st-method-post { background: var(--ok-soft); color: var(--ok); }
.st-method-patch { background: var(--method-patch-soft); color: var(--method-patch); }
.st-method-put { background: var(--warn-soft); color: var(--warn); }
.st-method-delete { background: var(--error-soft); color: var(--error); }

/* NavItem */
.st-nav { display: flex; align-items: center; gap: var(--space-3); width: 100%; height: 40px; padding: 0 var(--space-3); border: 1px solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--ink-muted); font-family: var(--font-sans); font-size: 14px; line-height: 20px; text-decoration: none; text-align: left; cursor: pointer; }
.st-nav:hover { background: var(--bg-300); color: var(--ink); }
.st-nav.is-active { background: var(--accent-soft); color: var(--ink); font-weight: 500; box-shadow: var(--shadow-active); }
.st-nav.is-active .st-icon { color: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }
.st-nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-nav-count { font-family: var(--font-mono); font-size: 11px; line-height: 16px; color: var(--ink-subtle); }
.st-nav.is-active .st-nav-count { color: var(--accent); }

/* Select */
.st-select { position: relative; display: inline-flex; align-items: center; gap: var(--space-2); height: 32px; padding: 0 30px 0 var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--bg-300); color: var(--ink-muted); }

.st-panel, .st-stat, .st-pc { position: relative; }

/* Seleção e clique em listas e tabela (o globo gira para a origem) */

.st-glass .st-rank-item { background: rgba(0, 229, 255, 0.02); border-color: rgba(0, 229, 255, 0.14); }

.st-glass .st-table th { background: transparent; }

[data-theme="light"] .st-glass, [data-theme="light"] .st-glass.st-panel, [data-theme="light"] .st-glass.st-stat, [data-theme="light"] .st-glass.st-pc { background: rgba(255, 255, 255, 0.55); border-color: rgba(0, 115, 163, 0.22); }

(function () {
// Dados de demonstração: usados enquanto o token do Supabase não estiver configurado.

let seed = 42;
const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
const pick = (a) => a[Math.floor(rnd() * a.length)];

const CITIES = [
  ['Rio de Janeiro', 'BR', -22.9, -43.2, 9], ['São Paulo', 'BR', -23.5, -46.6, 5], ['Niterói', 'BR', -22.88, -43.1, 3],
  ['Belo Horizonte', 'BR', -19.9, -43.9, 1.5], ['Lisboa', 'PT', 38.7, -9.1, 0.8], ['Ashburn', 'US', 39.0, -77.5, 1.2],
  ['Frankfurt', 'DE', 50.1, 8.7, 0.3], ['Singapura', 'SG', 1.35, 103.8, 0.15],
];
const PATHS = [
  ['GET', '/rest/v1/alunos'], ['POST', '/auth/v1/token'], ['GET', '/rest/v1/notas'], ['GET', '/storage/v1/object/boletins'],
  ['POST', '/functions/v1/notificar'], ['POST', '/rest/v1/rpc/boletim'], ['GET', '/realtime/v1/websocket'], ['PATCH', '/rest/v1/matriculas'],
];
const PEAK = [0.05, 0.02, 0.35, 1, 0.8, 0.9, 0.55, 0.2];

function project(ref, name, region, scale, errRate) {
  seed = ref.length * 97 + scale;
  const now = Date.now();
  const hourly = [];
  for (let i = 23; i >= 0; i--) {
    const d = new Date(now - i * 3600e3);
    d.setUTCMinutes(0, 0, 0);
    const hr = (d.getUTCHours() + 21) % 24;
    const n = Math.round(scale * PEAK[Math.floor(hr / 3)] * (0.7 + rnd() * 0.6));
    hourly.push({ h: d.toISOString().slice(0, 19) + 'Z', n, e: Math.round(n * errRate * rnd() * 2) });
  }
  const total = hourly.reduce((s, x) => s + x.n, 0);
  const e5 = hourly.reduce((s, x) => s + x.e, 0);
  const paths = [];
  PATHS.forEach(([method, path], pi) => {
    for (let slot = 0; slot < 8; slot++) {
      const n = Math.round((scale / 6) * PEAK[slot] * (0.2 + rnd()) * (pi % 3 === 1 ? 1.6 : 1));
      if (n) paths.push({ method, path, slot, n, e: Math.round(n * errRate * (pi === 7 ? 6 : rnd())), p95: Math.round(80 + rnd() * (pi === 7 ? 1400 : 300)) });
    }
  });
  const geo = CITIES.map(([city, country, lat, lon, w]) => ({ city, country, lat, lon, n: Math.round(total * w / 21 * (0.6 + rnd() * 0.8)), denied: Math.round(rnd() * (country === 'SG' ? 30 : 4)) }));
  const recent = [];
  for (let i = 0; i < 25; i++) {
    const [method, path] = pick(PATHS);
    const c = pick(CITIES.slice(0, 5));
    const r = rnd();
    recent.push({ ts: new Date(now - i * 47000 - rnd() * 30000).toISOString().slice(0, 19) + 'Z', method, path, status: r < errRate * 4 ? 500 : r < 0.08 ? 401 : method === 'POST' ? 201 : 200, latency: Math.round(40 + rnd() * rnd() * 1500), city: c[0], country: c[1] });
  }
  return {
    ref, name, region, supabaseStatus: 'ACTIVE_HEALTHY',
    summary: { total, e5, e4: Math.round(total * 0.02), p95: Math.round(120 + rnd() * 400), ips: Math.round(total / 60), countries: 6 },
    hourly, paths, geo, recent,
  };
}

function demoOverview() {
  return {
    demo: true,
    generatedAt: new Date().toISOString(),
    projects: [

  };
}
